<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mise">
<meta name="theme-color" content="#f3f1ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0e12" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Mise – Wochenküche</title>
<style>
/* VOICE: ruhig, edel, iOS-nativ – wenig Text, klare Hierarchie, kein Schnickschnack
   IDEA: eine Küchen-Glasvitrine: frostige Glasflächen über warmen Zutatenfarben
   PICTURE: Gerichte als gezeichnete Teller, Schritte als kleine Küchenszenen
   COLOUR and TYPE: weicher Grund mit Paprika/Safran/Basilikum-Licht, Ink als Auswahl, Paprika-Orange als Aktion; SF Pro / Inter
   LAYOUT: eine Spalte, schwebende Glas-Tabbar, Sheets für Rezepte */
:root{color-scheme:light dark;
--bg:light-dark(#f3f1ef,#0c0e12);--ink:light-dark(#15171c,#f3f3f6);--mut:light-dark(#646a77,#a2a7b4);
--acc:#ff5b35;--ok:light-dark(#23875a,#4cc68b);
--gl:light-dark(rgba(255,255,255,.60),rgba(30,32,40,.58));--gl2:light-dark(rgba(255,255,255,.50),rgba(255,255,255,.07));
--bd:light-dark(rgba(255,255,255,.85),rgba(255,255,255,.12));--line:light-dark(rgba(20,20,30,.08),rgba(255,255,255,.08));
--hi:light-dark(rgba(255,255,255,.95),rgba(255,255,255,.10));--sh:light-dark(0 12px 34px rgba(60,40,20,.10),0 12px 34px rgba(0,0,0,.5))}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;overflow-x:clip;min-height:100vh;
padding:calc(env(safe-area-inset-top) + 12px) 0 calc(env(safe-area-inset-bottom) + 110px)}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
background:radial-gradient(38% 30% at 18% 12%,light-dark(rgba(255,120,80,.35),rgba(255,91,53,.22)),transparent 70%),
radial-gradient(34% 28% at 88% 30%,light-dark(rgba(255,196,70,.35),rgba(255,180,60,.14)),transparent 70%),
radial-gradient(40% 32% at 30% 85%,light-dark(rgba(90,190,120,.28),rgba(60,170,110,.14)),transparent 70%)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.glass{background:var(--gl);-webkit-backdrop-filter:blur(24px) saturate(1.8);backdrop-filter:blur(24px) saturate(1.8);border:1px solid var(--bd);border-radius:26px;box-shadow:inset 0 1px 0 var(--hi),var(--sh)}
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 4px 2px}
.brand{font-weight:700;letter-spacing:-.02em;font-size:17px;display:flex;gap:8px;align-items:center}
.brand i{width:22px;height:22px;border-radius:7px;background:conic-gradient(from 200deg,#ff5b35,#ffb444,#3fb57a,#ff5b35);display:block}
.pill{font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;background:var(--gl2);border:1px solid var(--bd)}
h1{font-size:34px;line-height:1.08;letter-spacing:-.03em;margin:14px 4px 4px;text-wrap:balance}
.sub{color:var(--mut);margin:0 4px 18px;font-size:16px}
.card{padding:18px;margin-bottom:14px}
.card h2{font-size:20px;letter-spacing:-.02em;margin:0 0 4px;line-height:1.2}
.card p.h{margin:0 0 14px;color:var(--mut);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:999px;background:var(--gl2);border:1px solid var(--line);font-size:15px;font-weight:500;transition:background .2s,color .2s,transform .15s}
.chip:active{transform:scale(.96)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:transparent}
.grp{font-size:13px;color:var(--mut);font-weight:600;margin:14px 2px 8px}
.stores{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.store{min-height:76px;border-radius:20px;background:var(--gl2);border:1px solid var(--line);text-align:left;padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between}
.store b{font-size:17px}.store small{color:var(--mut);font-size:13px}
.store[aria-pressed=true]{background:var(--ink);color:var(--bg)}.store[aria-pressed=true] small{color:inherit;opacity:.7}
.dots{letter-spacing:2px}
.prog{display:flex;gap:6px;margin:0 4px 16px}
.prog button{flex:1;height:44px;display:flex;flex-direction:column;justify-content:center;gap:6px;font-size:12px;color:var(--mut);font-weight:600}
.prog button::before{content:"";height:4px;border-radius:4px;background:var(--line)}
.prog button.on{color:var(--ink)}.prog button.on::before{background:var(--ink)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.step{display:flex;align-items:center;gap:4px;background:var(--gl2);border:1px solid var(--line);border-radius:999px;padding:3px}
.step button{width:40px;height:40px;border-radius:50%;font-size:20px;font-weight:500}
.step output{min-width:28px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--gl2);border:1px solid var(--line);border-radius:14px;padding:3px}
.seg button{min-height:38px;padding:0 12px;border-radius:11px;font-size:14px;font-weight:600;color:var(--mut)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.nav{display:flex;gap:10px;margin-top:6px}
.btn{min-height:52px;border-radius:18px;padding:0 20px;font-weight:600;font-size:16px;flex:1}
.btn.pri{background:var(--acc);color:#fff;box-shadow:0 8px 22px rgba(255,91,53,.35)}
.btn.sec{background:var(--gl);border:1px solid var(--bd);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.search{width:100%;min-height:46px;border-radius:14px;border:1px solid var(--line);background:var(--gl2);color:var(--ink);font:16px inherit;padding:0 14px;margin-bottom:4px}
.dish{display:grid;grid-template-columns:84px minmax(0,1fr) 30px;gap:14px;align-items:start;padding:12px;margin-bottom:12px;transition:transform .15s}
.dish:active{transform:scale(.985)}
.dish.sel{outline:2px solid var(--ink);outline-offset:-2px}
.thumb{width:84px;height:84px;border-radius:18px;overflow:hidden;display:block}
.thumb svg{width:100%;height:100%;display:block}
.dish h3{margin:2px 0 4px;font-size:17px;line-height:1.25;letter-spacing:-.01em}
.meta{font-size:13px;color:var(--mut)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--line);color:var(--mut)}
.tag.m{background:var(--ink);color:var(--bg)}
.tag.o{background:light-dark(rgba(35,135,90,.12),rgba(76,198,139,.16));color:var(--ok)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.price{font-weight:700;font-size:15px;white-space:nowrap}
.link{font-size:14px;font-weight:600;color:var(--acc);min-height:36px;padding:0 2px}
.tick{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;margin-top:2px}
.sel .tick,.it.done .tick{background:var(--ink);border-color:var(--ink)}
.tick svg{width:16px;height:16px;stroke:var(--bg);opacity:0}.sel .tick svg,.it.done .tick svg{opacity:1}
.bar{position:sticky;top:calc(env(safe-area-inset-top) + 8px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 10px 10px 18px;margin-bottom:14px;border-radius:22px}
.bar b{font-size:15px}.bar .btn{flex:none;min-height:44px;font-size:15px}
.big{font-size:clamp(36px,10vw,46px);font-weight:700;letter-spacing:-.03em;line-height:1;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.kpi{background:var(--gl2);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.kpi small{display:block;color:var(--mut);font-size:13px}.kpi b{font-size:20px;white-space:nowrap}
.cmp{display:grid;grid-template-columns:76px minmax(0,1fr) 72px;gap:10px;align-items:center;font-size:14px;margin:7px 0}
.cmp .tr{height:10px;border-radius:6px;background:var(--line);overflow:hidden}.cmp .tr i{display:block;height:100%;border-radius:6px;background:var(--mut);opacity:.5}
.cmp.cur{font-weight:700}.cmp.cur .tr i{background:var(--acc);opacity:1}
.cmp span:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.it{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--line);min-height:56px}
.it:first-of-type{border-top:0}
.it .n{font-weight:600;font-size:16px}.it .f{display:block;font-size:12px;color:var(--mut)}
.it .q{text-align:right;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}.it .q small{display:block;color:var(--mut)}
.it.done .n{text-decoration:line-through;color:var(--mut)}
.day{display:grid;grid-template-columns:44px 56px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--line)}
.day:first-of-type{border-top:0}
.day .d{font-weight:700;color:var(--mut);font-size:14px}.day .thumb{width:56px;height:56px;border-radius:14px}
.note{font-size:13px;color:var(--mut);margin:8px 4px 0}
.empty{text-align:center;padding:36px 20px}.empty p{color:var(--mut)}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 12px);width:min(440px,calc(100% - 24px));display:grid;grid-template-columns:repeat(4,1fr);padding:6px;border-radius:30px;z-index:20}
.tabbar button{position:relative;min-height:56px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--mut)}
.tabbar button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current=true]{color:var(--ink);background:var(--gl2)}
.badge{position:absolute;top:5px;right:calc(50% - 22px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--acc);color:#fff;font-size:11px;line-height:18px}
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.28)}
.sheet[hidden]{display:none}
.panel{width:min(720px,100%);max-height:92vh;overflow:auto;border-radius:30px 30px 0 0;padding:0 0 calc(env(safe-area-inset-bottom) + 24px);overscroll-behavior:contain}
.hero{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:30px 30px 0 0}.hero svg{width:100%;height:100%;display:block}
.x{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;font-size:22px}
.pb{padding:18px 20px 0}
.pb h2{font-size:28px;line-height:1.1;letter-spacing:-.03em;margin:0 0 6px}
.nut{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:14px 0}
.nut div{text-align:center;background:var(--gl2);border:1px solid var(--line);border-radius:16px;padding:10px 4px}
.nut b{display:block;font-size:17px}.nut small{font-size:12px;color:var(--mut)}
.ing{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.ing span:last-child{white-space:nowrap;color:var(--mut);font-variant-numeric:tabular-nums}
.ing .have{color:var(--ok);font-size:12px;font-weight:600;margin-left:6px}
.stp{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin:16px 0 22px}
.stp svg{width:100%;height:auto;display:block;border-radius:18px}
.stp p{margin:0;font-size:16px}.stp b{color:var(--acc);margin-right:6px}
@media(min-width:560px){.stp{grid-template-columns:200px minmax(0,1fr);align-items:center}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%);padding:12px 18px;border-radius:16px;font-weight:600;font-size:14px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.v{animation:in .35s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.fav{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;margin:-8px -8px 0 0}
.fav svg{width:22px;height:22px;fill:none;stroke:var(--mut);stroke-width:2}
.fav[aria-pressed=true] svg{fill:var(--acc);stroke:var(--acc)}
.side{display:flex;flex-direction:column;align-items:center;gap:6px}
.tools{display:flex;gap:8px;margin-bottom:14px;align-items:center}
.tools .search{margin:0;flex:1}
.tools .chip{flex:none}
.more{width:100%;margin:2px 0 14px}
details.cmpbox{margin-top:12px}details.cmpbox summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--mut);min-height:44px;display:flex;align-items:center;list-style:none}
details.cmpbox summary::-webkit-details-marker{display:none}details.cmpbox summary::after{content:"›";margin-left:6px;transition:transform .2s}details.cmpbox[open] summary::after{transform:rotate(90deg)}
.hint{display:flex;gap:12px;align-items:flex-start}.hint p{margin:0;font-size:14px;color:var(--mut)}.hint b{color:var(--ink)}
.hint .x2{flex:none;width:36px;height:36px;border-radius:50%;background:var(--gl2);font-size:18px}
.x{display:grid;place-items:center}
.sheetfav{position:absolute;top:12px;right:64px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.sheetfav svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:2}.sheetfav[aria-pressed=true] svg{fill:var(--acc);stroke:var(--acc)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand"><i></i>Mise</div><span class="pill" id="storePill"></span></div>
  <main id="app"></main>
  <p class="note">Preise grob geschätzt auf Basis typischer Discounter-Preise.</p>
</div>
<nav class="tabbar glass" id="tabs" aria-label="Bereiche"></nav>
<div class="sheet" id="sheet" hidden></div>
<div class="toast glass" id="toast" role="status"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
